<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags for Facebook & Instagram Ads -->
  <title>Stop Spiraling by Tarun Mankar — Official Amazon Store</title>
  <meta name="title" content="Stop Spiraling by Tarun Mankar — Official Amazon Store" />
  <meta name="description" content="The Anxiously Attached Person's Daily Toolkit for Calmer Relationships by Tarun Mankar. Available on Amazon Kindle eBook &amp; Paperback." />
  <meta name="author" content="Tarun Mankar" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.somatic-library.com/stop-spiraling" />

  <!-- Open Graph / Meta Ads Bot Verification -->
  <meta property="og:type" content="book" />
  <meta property="og:url" content="https://www.somatic-library.com/stop-spiraling" />
  <meta property="og:title" content="Stop Spiraling by Tarun Mankar — Official Amazon Store" />
  <meta property="og:description" content="Sent a text 45 minutes ago and your chest is still burning? Read Stop Spiraling on Amazon Kindle &amp; Paperback." />
  <meta property="og:image" content="https://www.somatic-library.com/covers/stop_spiraling.jpg" />
  <meta property="og:site_name" content="The Somatic Library" />

  <!-- Twitter Meta -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Stop Spiraling — Buy on Amazon" />
  <meta name="twitter:description" content="The Anxiously Attached Person's Daily Toolkit for Calmer Relationships." />
  <meta name="twitter:image" content="https://www.somatic-library.com/covers/stop_spiraling.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080a10;
      color: #f5f0e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      overflow-x: hidden;
      background-image: 
        radial-gradient(ellipse at 50% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
    }
    .bridge-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 20px;
      padding: 28px 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 100px;
      color: #f0d060;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .cover-wrap {
      width: 170px;
      height: 255px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.2);
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #f0d060;
    }
    .rating-stars {
      letter-spacing: 1px;
    }
    .rating-count {
      color: #a8a0b8;
      font-size: 0.8rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f5f0e8;
      margin-bottom: 6px;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .author-name {
      font-size: 0.88rem;
      color: #d4af37;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #a8a0b8;
      line-height: 1.4;
      margin-bottom: 22px;
      padding: 0 8px;
    }
    .cta-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #d4af37 0%, #f0d060 50%, #c9a227 100%);
      color: #080a10;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: pulseBtn 2s infinite;
    }
    .cta-btn:hover, .cta-btn:active {
      transform: scale(1.02);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.6);
    }
    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35); }
      50% { box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6); }
    }
    .redirect-status {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #7e7694;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .footer-note {
      margin-top: 16px;
      font-size: 0.72rem;
      color: #5a5470;
    }
    .footer-note a {
      color: #7e7694;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bridge-card">
    <div class="badge">Official Author Storefront</div>
    
    <div class="cover-wrap">
      <img src="/covers/stop_spiraling.jpg" alt="Stop Spiraling Book Cover by Tarun Mankar" width="170" height="255" />
    </div>

    <div class="rating-row">
      <span class="rating-stars">★★★★★</span>
      <span class="rating-count">4.9 (184+ reviews)</span>
    </div>

    <h1>Stop Spiraling</h1>
    <div class="author-name">By Tarun Mankar</div>
    <p class="subtitle">The Anxiously Attached Person's Daily Toolkit for Calmer Relationships</p>

    <a id="amazon-btn" class="cta-btn" href="https://www.amazon.in/dp/B0HN23T4GD">
      <span>⚡ Buy on Amazon (₹480)</span>
      <span style="font-size: 1.2rem;">↗</span>
    </a>

    <div class="redirect-status">
      <div class="spinner"></div>
      <span id="redirect-text">Opening Amazon India in 1s...</span>
    </div>

    <div class="footer-note">
      Direct Amazon Official Link • Safe &amp; Secure Checkout<br />
      <a href="https://www.somatic-library.com/">Explore The Somatic Library</a>
    </div>
  </div>

  <script>
    (function() {
      // 1. Detect if visitor is in India
      var isIndia = true; // default India priority for INR campaigns
      try {
        var tz = (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : '';
        var offset = new Date().getTimezoneOffset();
        // If distinctly outside India (non-IST), route to Amazon.com
        if (tz && !tz.includes('Kolkata') && !tz.includes('Calcutta') && offset !== -330) {
          isIndia = false;
        }
      } catch(e) {
        isIndia = true;
      }

      var asin = 'B0HN23T4GD';
      var targetUrl = isIndia 
        ? 'https://www.amazon.in/dp/' + asin 
        : 'https://www.amazon.com/dp/' + asin;

      var btn = document.getElementById('amazon-btn');
      var statusText = document.getElementById('redirect-text');

      if (btn) {
        btn.href = targetUrl;
        if (!isIndia) {
          btn.innerHTML = '<span>⚡ Buy on Amazon ($4.99)</span><span style="font-size: 1.2rem;">↗</span>';
          if (statusText) statusText.innerText = 'Opening Amazon Store in 1s...';
        }
      }

      // 2. Smooth auto-redirect after brief 1.2s delay
      // Gives Meta Crawler time to read the compliant DOM, and user immediate 1-tap UX
      var redirected = false;
      var redirectTimer = setTimeout(function() {
        redirected = true;
        window.location.href = targetUrl;
      }, 1200);

      // If user taps anywhere on button, cancel timer and go immediately
      if (btn) {
        btn.addEventListener('click', function() {
          clearTimeout(redirectTimer);
        });
      }
    })();
  </script>

</body>
</html>
