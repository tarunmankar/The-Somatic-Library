<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141826" />
      <stop offset="60%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae89f" />
      <stop offset="30%" stop-color="#e8c84a" />
      <stop offset="70%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#8e6c13" />
    </linearGradient>

    <!-- Inner Core Gold Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a227" />
      <stop offset="50%" stop-color="#fff4be" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Subtle Golden Aura -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Luxury Obsidian Finish -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="107" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Central Somatic Diamond Emblem (◈) -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Outer Faceted Diamond Ring -->
    <polygon points="0,-160 160,0 0,160 -160,0" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linejoin="round" />

    <!-- Secondary Diamond Layer -->
    <polygon points="0,-110 110,0 0,110 -110,0" fill="none" stroke="url(#goldLight)" stroke-width="9" stroke-opacity="0.9" stroke-linejoin="round" />

    <!-- Center Radiant Diamond Core -->
    <polygon points="0,-64 64,0 0,64 -64,0" fill="url(#goldGrad)" />

    <!-- Somatic Calming Pupil / Core Center -->
    <circle cx="0" cy="0" r="14" fill="#06080d" />
    <circle cx="0" cy="0" r="5" fill="#fffbe6" />
  </g>
</svg>
